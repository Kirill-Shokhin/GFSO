name: tests

# THE GATES, and how to run them by hand:
#   python -m pytest -q                    (the suite; `pip install -e .[dev]` first)
#   bash formal/scripts/check_refs.sh      §-refs cited anywhere name a section the canon has
#   bash formal/scripts/check_naming.sh    no retired spelling survives, no kept homograph vanished
#   bash formal/scripts/check_claims.sh    the counts stated in prose are read off the canon and compared
#   bash formal/scripts/check_closure.sh   the Lean development declares no axiom outside the whitelist
#                                          (needs elan/lake — the other three need only bash)
# A term that reads like GFSO's but is not the canon's fails a guard: do not invent vocabulary.
# Nothing in this repository's prose may state an EFFECT of using GFSO — no measurement exists yet.
#
# The mechanical gates ride in here: the layer gate (tests/test_layering.py — a dependency-rule
# violation is a RED CI, not a review comment), the core-dist closure (tests/test_core_dist.py —
# the gfso-core cut stays zero-dependency and closed on every push), and the distribution check
# (tests/test_distribution.py — the built wheel is installed and driven from outside the checkout).
#
# The path lists carry the packaging and release surface too: they were narrower, so an edit to
# CHANGELOG, MANIFEST.in or a workflow itself ran nothing at all. (Written out twice because GitHub
# Actions does not resolve YAML anchors.)
on:
  push:
    paths:
      - 'gfso/**'
      - 'tests/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'gfso/**'
      - 'tests/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # The edges of what `requires-python = ">=3.11"` promises, on both developed platforms.
        # A middle version buys little; an unchecked edge is an untested claim on the PyPI page.
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev] build
      # THE REASON MUST BE READABLE WITHOUT ADMIN RIGHTS. A red run said only "Process completed with
      # exit code 1" to anyone but the repository's owner — the job log needs admin, so the one person
      # who could act on a failure from a laptop could not see which test failed. The summary is
      # public on the run's page, so the failing names travel with the red.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest.out || rc=$?
          # THE REPORTING MUST NOT DECIDE THE BUILD. The runner's bash carries `-e`, and a `grep`
          # that matches nothing — exactly what a green suite looks like — exits 1 and took the step
          # down with it: a passing suite reported as a failed build on all four matrix legs. The
          # verdict is pytest's return code and nothing else, so the lines below run with `-e` off.
          set +e
          {
            echo "### pytest — ${{ matrix.os }}, Python ${{ matrix.python-version }}"
            echo '```'
            grep -E '^(FAILED|ERROR)' pytest.out | head -40
            tail -n 15 pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # …and as ANNOTATIONS, the part a reader WITHOUT admin rights can fetch: a job log needs
          # admin, and the step summary is not served with the check run, so a red build answered
          # "Process completed with exit code 1" to everyone but the repository's owner.
          grep -E '^(FAILED|ERROR)' pytest.out | head -40 | while IFS= read -r line; do
            echo "::error title=pytest ${{ matrix.os }} py${{ matrix.python-version }}::${line}"
          done
          exit ${rc:-0}
