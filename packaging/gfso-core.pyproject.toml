# The gfso-core distribution's pyproject — used by packaging/build_core.py, which stages the
# manifest files (packaging/core_manifest.py) into a build tree next to this file. ZERO runtime
# dependencies is the contract (tests/test_core_dist.py enforces it continuously); no extras —
# the CHECK-7/8 formula tier's solver extra ships together with its implementation, not before.
# Published at distribution time; until then the main `gfso` distribution ships the same files
# inline.
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfso-core"
version = "0.0.0"  # placeholder — build_core.py injects the MAIN pyproject version (one source)
description = "GFSO protocol core: the canon-governed standard (FSM, signals, invariants, checks, metrics) + the reference runtime — zero dependencies"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
