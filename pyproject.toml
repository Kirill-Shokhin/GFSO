[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gfso"
version = "0.2.0"
description = "GFSO: General Framework for Structured Operations — protocol engine"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39.0"]
solver = ["z3-solver"]
dev = ["pytest>=7.0", "httpx>=0.25.0"]
all = ["gfso[llm,solver]"]

[project.scripts]
gfso = "gfso.cli:main"

[tool.setuptools.package-data]
"gfso.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
