[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gfso"
version = "0.1.0"
description = "GFSO: General Framework for Structured Operations — protocol engine"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
solver = ["z3-solver"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
